general {
    grace = 1
    immediate_render = true
    hide_cursor = true
}

animations {
    enabled = true
}

bezier = magnetismSmooth, 0.2, 0.0, 0.0, 1.0
bezier = magnetismPop, 0.05, 0.9, 0.1, 1.08
animation = fade, 1, 4.0, magnetismSmooth
animation = fadeIn, 1, 5.0, magnetismSmooth
animation = fadeOut, 1, 3.5, magnetismSmooth
animation = inputField, 1, 4.0, magnetismPop
animation = inputFieldColors, 1, 3.0, magnetismSmooth
animation = inputFieldFade, 1, 4.0, magnetismSmooth
animation = inputFieldWidth, 1, 4.0, magnetismPop
animation = inputFieldDots, 1, 3.0, magnetismPop

background {
    monitor =
    path = /home/matte/.config/hypr/magnetism.png
    color = rgb(000000)
    blur_size = 0
    blur_passes = 0
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(f5f5f5)
    font_size = 88
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A  %d %B"
    color = rgb(a8a8a8)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, 14
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    outline_thickness = 1
    dots_size = 0.20
    dots_spacing = 0.42
    dots_center = true
    rounding = 3
    outer_color = rgb(f5f5f5)
    inner_color = rgb(080808)
    font_color = rgb(f5f5f5)
    fade_on_empty = true
    placeholder_text = Password
    fail_text = Authentication failed
    position = 0, -90
    halign = center
    valign = center
}
